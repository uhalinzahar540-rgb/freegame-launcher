name: Build Windows installer

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Run native tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build installer and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the app so "Check for launcher updates" looks at this repository's releases.
          FGL_UPDATE_URL: https://api.github.com/repos/${{ github.repository }}/releases/latest
        with:
          tagName: v__VERSION__
          releaseName: FreeGame Launcher v__VERSION__
          releaseBody: |
            Windows installer: download the `*-setup.exe` file below and run it.
            The installer lets you pick the interface language; you can change it later in Settings.
          releaseDraft: false
          prerelease: false

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeGame-Launcher-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
