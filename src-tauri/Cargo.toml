[package]
name = "freegame-launcher"
version = "0.1.0"
description = "FreeGame Launcher — catalog, downloads, installation and launching of games"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "time", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream", "json", "http2"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
crc32fast = "1"
zip = { version = "2.4", default-features = false, features = ["deflate", "deflate64"] }
sevenz-rust = "0.6"
fs2 = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4"] }
sys-locale = "0.3"
rss = { version = "2", default-features = false }
walkdir = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
